version: '3.8'

services:
  # Serviço 1: Banco de Dados PostgreSQL
  postgres-db:
    image: postgres:15-alpine  # Nota: A versão estável atual é a 15/16. Não existe Postgres 18 ainda.
    container_name: meu-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Persistência de dados (letras minúsculas)
    networks:
      - rede-interna

  # Serviço 2: Aplicação Web
  app:
    build: .
    container_name: minha-aplicacao-web
    restart: always
    ports:
      - "${APP_PORT}:3000"
    environment:
      DB_HOST: postgres-db # Usa o nome do serviço como host de conexão
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      - postgres-db # Garante que o banco suba antes da aplicação
    networks:
      - rede-interna

networks:
  rede-interna:
    driver: bridge

volumes:
  pgdata: # Volume gerenciado para o banco de dados

